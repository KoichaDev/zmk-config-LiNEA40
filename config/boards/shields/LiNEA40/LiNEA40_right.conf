# GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y

# Trackball
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_PMW3610=y    
CONFIG_PMW3610_SMART_ALGORITHM=y
# matches Keyball39's effective CPI (3200/3=1067) instead of our old 800/1; scroll uses the
# out-of-tree scroll-skip-125sw-combine driver fork so SCROLL_TICK stays independent of this
CONFIG_PMW3610_CPI=3200
CONFIG_PMW3610_CPI_DIVIDOR=3
CONFIG_PMW3610_SNIPE_CPI=800
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=3
# raw scroll-tick count is CPI-independent thanks to the scroll-skip-125sw-combine driver
# fork (SCROLL always uses dividor=1 internally regardless of CPI_DIVIDOR), so this does NOT
# need to be rescaled when CPI changes - leave at 8
CONFIG_PMW3610_SCROLL_TICK=8
# reverted native POLLING_RATE_250 experiment: it halves each HID report's delta magnitude
# (250Hz sends every raw sample individually vs 125_SW's combine-2-into-1), which made the
# cursor feel much slower due to nonlinear OS/BLE pointer-acceleration response to smaller
# per-report deltas - not worth it just to fix scroll consistency. Back to combine mode.
CONFIG_PMW3610_POLLING_RATE_125_SW=y
# NOTE: CONFIG_PMW3610_MOVEMENT_THRESHOLD does not exist in this repo's driver fork
# (koichadev/fix/scroll-skip-125sw-combine, based on inorichi/main) - Keyball39 uses a
# different fork (kumamuk-git) that has this option; omitted here, CI build fails otherwise.
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=0
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=0
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS
#CONFIG_PMW3610_ORIENTATION_0=y
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
#CONFIG_PMW3610_INVERT_SCROLL_X=y


# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# Lower latency BLE connection - tightened from MIN=9/MAX=12 to match Keyball39's fixed 6
# (7.5ms) so higher-CPI HID reports flush fast enough to not queue/lag on fast trackball
# swipes. NOTE: MIN/MAX=9/12 was originally chosen to fix a "need to press cmd+t multiple
# times after idle" symptom - that was BEFORE the automouse-layer root cause (see repo
# memory) was found and fixed, so it may not have been the real cause. If dropped/delayed
# keystrokes after idle reappear, revert MIN/MAX back to 9/12 first before touching CPI.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_BUF_ACL_TX_COUNT=64
CONFIG_BT_L2CAP_TX_BUF_COUNT=64
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
