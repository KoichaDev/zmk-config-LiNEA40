manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: inorichi
      url-base: https://github.com/inorichi
    - name: koichadev
      url-base: https://github.com/KoichaDev
    - name: keyfreaks
      url-base: https://github.com/kay-yokoyama
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.2.1
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: koichadev
      # fork of inorichi/main: SCROLL mode skips the 125Hz sample combine/discard so slow
      # scrolling no longer drops samples that land >128ms apart (see zmk-LiNEA40-notes)
      revision: fix/scroll-skip-125sw-combine
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3-branch
  self:
    path: config
